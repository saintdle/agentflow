name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run deterministic validation
        run: python scripts/validate.py

  beads-smoke:
    name: Real Beads 1.1.0 smoke (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENTFLOW_INTEGRATION: "1"
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=gms_pure_go"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Go for Beads 1.1.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: false
      - name: Install Agentflow and pinned Beads
        run: |
          python -m pip install --disable-pip-version-check .
          go install github.com/steveyegge/beads/cmd/bd@v1.1.0
      - name: Run real integration smoke
        run: scripts/ci/integration_beads.sh

  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-14
            python: "3.10"
          - os: macos-14
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [validate, unit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect package contents and privacy boundary
        run: python scripts/ci/inspect_distribution.py dist --expected-version 0.0.8
      - name: Smoke-test wheel outside the checkout
        run: python scripts/ci/smoke_wheel.py dist/*.whl --expected-version 0.0.8
      - name: Upload inspected distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentflow-pr-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
