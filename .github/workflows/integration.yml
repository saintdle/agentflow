name: Real integration

on:
  schedule:
    - cron: "43 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beads:
    name: Agentflow with Beads 1.3.1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENTFLOW_INTEGRATION: "1"
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=gms_pure_go"
      AGENTFLOW_SHARED_INTEGRATION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Go for the pinned Beads prerequisite
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false
      - name: Install Agentflow and Beads
        run: |
          python -m pip install --disable-pip-version-check .
          go install github.com/steveyegge/beads/cmd/bd@v1.3.1
      - name: Install pinned Dolt and sealed-store fixture binary
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/dolthub/dolt/releases/download/v2.5.0/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt.tar.gz"
          echo "639b8042d1ea46ebf6b645a002fc787134dbe1dc02888cc51a51d1d3eb557c93  $RUNNER_TEMP/dolt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dolt-linux-amd64/bin" >> "$GITHUB_PATH"
          python scripts/ci/install_beads.py 1.1.0 "$RUNNER_TEMP/beads-legacy"
          echo "AGENTFLOW_OLD_BD=$RUNNER_TEMP/beads-legacy/bd" >> "$GITHUB_ENV"
      - name: Run explicitly gated real integration
        run: scripts/ci/integration_beads.sh
