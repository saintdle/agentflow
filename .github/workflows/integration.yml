name: Real integration

on:
  schedule:
    - cron: "43 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beads:
    name: Agentflow with Beads 1.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENTFLOW_INTEGRATION: "1"
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=gms_pure_go"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Go for the pinned Beads prerequisite
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: false
      - name: Install Agentflow and Beads
        run: |
          python -m pip install --disable-pip-version-check .
          go install github.com/steveyegge/beads/cmd/bd@v1.1.0
      - name: Run explicitly gated real integration
        run: scripts/ci/integration_beads.sh
