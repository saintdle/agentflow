name: GitHub prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and attach prerelease artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify tag, contents, and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          python scripts/ci/inspect_distribution.py dist --expected-version "${expected_version}"
          python scripts/ci/smoke_wheel.py dist/*.whl --expected-version "${expected_version}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentflow-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag --prerelease --generate-notes \
              --title "Agentflow ${GITHUB_REF_NAME}"
          fi

      # Deliberately no PyPI trusted-publishing permission, token, or upload command.
