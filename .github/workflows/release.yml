name: GitHub prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and attach prerelease artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify reviewed main and required checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          for workflow in ci.yml security.yml build-main.yml; do
            successful_runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
              --jq '.total_count')"
            if [[ "${successful_runs}" -lt 1 ]]; then
              echo "No successful ${workflow} push run exists for ${GITHUB_SHA}." >&2
              exit 1
            fi
          done
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; release assets are immutable." >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify tag, contents, and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          python scripts/ci/inspect_distribution.py dist --expected-version "${expected_version}"
          python scripts/ci/smoke_wheel.py dist/*.whl --expected-version "${expected_version}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentflow-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --prerelease --generate-notes \
            --title "Agentflow ${GITHUB_REF_NAME}"

      # Deliberately no PyPI trusted-publishing permission, token, or upload command.
