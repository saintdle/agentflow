name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit Python environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Resolve and audit declared project dependencies
        run: python -m pip_audit .

  source-secrets:
    name: Check committed source for credential material
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag for historical inspection
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
      - name: Reject sensitive file types and obvious private keys
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(pem|p12|pfx|key))$'; then
            echo "Sensitive file type is tracked." >&2
            exit 1
          fi
          if git grep -n -E -- 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY'; then
            echo "Private key material is tracked." >&2
            exit 1
          fi
      - name: Scan every historical blob reachable from every ref
        run: python scripts/ci/scan_git_history.py .
      - name: Apply the private publication denylist on trusted events
        if: github.event_name != 'pull_request'
        env:
          AGENTFLOW_PUBLICATION_DENYLIST: ${{ secrets.AGENTFLOW_PUBLICATION_DENYLIST }}
        run: python scripts/ci/scan_git_history.py .
