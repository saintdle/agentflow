name: Build main CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable CLI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect package contents and privacy boundary
        run: python scripts/ci/inspect_distribution.py dist --expected-version 0.0.7
      - name: Smoke-test wheel outside the checkout
        run: python scripts/ci/smoke_wheel.py dist/*.whl --expected-version 0.0.7
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentflow-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # This workflow intentionally has no package-registry credentials or publish step.
