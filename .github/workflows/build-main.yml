name: Build main CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable CLI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect package contents and privacy boundary
        run: python scripts/ci/inspect_distribution.py dist --expected-version 0.0.2
      - name: Smoke-test wheel outside the checkout
        run: python scripts/ci/smoke_wheel.py dist/*.whl --expected-version 0.0.2
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentflow-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # This workflow intentionally has no package-registry credentials or publish step.
